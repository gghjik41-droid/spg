    function rotateInforgArrow(up) {
        var toggle = document.getElementById('inforg-toggle');

        }

    function validateCoordinateInput(el) {
        var val = el.value;
        // Заменяем запятую на точку
        val = val.replace(',', '.');
        // Оставляем только цифры, точку и знак минус
        val = val.replace(/[^0-9.-]/g, '');
        
        // Минус может быть только в самом начале
        if (val.startsWith('-')) {
            val = '-' + val.slice(1).replace(/-/g, '');
        } else {
            val = val.replace(/-/g, '');
        }
        
        // Оставляем только первую точку
        var parts = val.split('.');
        if (parts.length > 2) {
            val = parts[0] + '.' + parts.slice(1).join('');
        }
        
        // Ограничиваем количество знаков после точки до 6
        if (val.indexOf('.') !== -1) {
            var dotIdx = val.indexOf('.');
            var beforeDot = val.substring(0, dotIdx);
            var afterDot = val.substring(dotIdx + 1);
            if (afterDot.length > 6) {
                afterDot = afterDot.substring(0, 6);
            }
            val = beforeDot + '.' + afterDot;
        }
        
        if (el.value !== val) {
            var selectionStart = el.selectionStart;
            var lengthDiff = el.value.length - val.length;
            el.value = val;
            if (typeof el.setSelectionRange === 'function') {
                el.setSelectionRange(selectionStart - lengthDiff, selectionStart - lengthDiff);
            }
        }
    }

    function handleCoordinatePaste(event) {
        var pasteData = '';
        if (event.clipboardData) {
            pasteData = event.clipboardData.getData('text');
        } else if (window.clipboardData) {
            pasteData = window.clipboardData.getData('Text');
        }
        
        if (!pasteData) return;
        
        var cleanPaste = pasteData.trim();
        // Регулярное выражение для поиска двух чисел (широты и долготы)
        var regex = /(-?\d+(?:[.,]\d+)?)\s*[\s,;:\/|]+\s*(-?\d+(?:[.,]\d+)?)/;
        var match = cleanPaste.match(regex);
        
        if (match) {
            event.preventDefault();
            
            var lat = match[1].replace(',', '.');
            var lon = match[2].replace(',', '.');
            
            var latInput = document.getElementById('f_staff_lat');
            var lonInput = document.getElementById('f_staff_lon');
            
            if (latInput && lonInput) {
                latInput.value = lat;
                lonInput.value = lon;
                
                validateCoordinateInput(latInput);
                validateCoordinateInput(lonInput);
                
                if (typeof syncEverything === 'function') {
                    syncEverything();
                }
            }
        }
    }

    function copyCoordinates() {
        var latInput = document.getElementById('f_staff_lat');
        var lonInput = document.getElementById('f_staff_lon');
        var lat = latInput ? latInput.value.trim() : '';
        var lon = lonInput ? lonInput.value.trim() : '';
        
        if (!lat || !lon) {
            alert('Заполните координаты штаба для копирования');
            return;
        }
        
        var coordsText = lat + ', ' + lon;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(coordsText).then(function() {
                showCopySuccess();
            }, function(err) {
                fallbackCopy(coordsText);
            });
        } else {
            fallbackCopy(coordsText);
        }
    }

    function fallbackCopy(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            var successful = document.execCommand('copy');
            if (successful) {
                showCopySuccess();
            } else {
                alert('Не удалось скопировать координаты');
            }
        } catch (err) {
            alert('Не удалось скопировать координаты');
        }
        document.body.removeChild(textarea);
    }

    function showCopySuccess() {
        var btn = document.getElementById('copy-btn');
        if (btn) {
            var originalColor = btn.style.color || '#2e7d32';
            btn.style.color = '#ff9800'; // Оранжевый цвет успешного копирования
            btn.title = 'Скопировано!';
            var origSvg = btn.innerHTML;
            btn.innerHTML = '<svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor; display: block;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
            setTimeout(function() {
                btn.style.color = originalColor;
                btn.title = 'Скопировать координаты';
                btn.innerHTML = origSvg;
            }, 1500);
        }
    }

    function toggleMapMenu(event) {
        if (event) event.stopPropagation();
        var menu = document.getElementById('map-menu');
        if (!menu) return;
        
        var latInput = document.getElementById('f_staff_lat');
        var lonInput = document.getElementById('f_staff_lon');
        var lat = latInput ? latInput.value.trim() : '';
        var lon = lonInput ? lonInput.value.trim() : '';
        
        if (!lat || !lon) {
            alert('Заполните координаты штаба');
            return;
        }
        
        document.getElementById('link-yandex-map').href = 'https://yandex.ru/maps/?text=' + lat + ',' + lon;
        document.getElementById('link-gurumaps').href = 'guru://show?place=' + lat + ',' + lon + '&zoom=16';
        document.getElementById('link-google-map').href = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon;
        document.getElementById('link-2gis').href = 'https://2gis.ru/search/' + lat + ',' + lon;
        
        if (menu.style.display === 'block') {
            menu.style.display = 'none';
            document.removeEventListener('click', closeMapMenu);
        } else {
            menu.style.display = 'block';
            setTimeout(function() {
                document.addEventListener('click', closeMapMenu);
            }, 0);
        }
    }

    function closeMapMenu() {
        var menu = document.getElementById('map-menu');
        if (menu) {
            menu.style.display = 'none';
        }
        document.removeEventListener('click', closeMapMenu);
    }

    function getCurrentGPS() {
        var latInput = document.getElementById('f_staff_lat');
        var lonInput = document.getElementById('f_staff_lon');
        var latVal = latInput ? latInput.value.trim() : '';
        var lonVal = lonInput ? lonInput.value.trim() : '';
        
        if (latVal || lonVal) {
            if (!confirm('Перезаписать координаты штаба?')) {
                return;
            }
        }

        var btn = document.getElementById('gps-btn');
        if (!navigator.geolocation) {
            alert('Ваш браузер не поддерживает геолокацию');
            return;
        }
        
        if (btn) {
            btn.style.color = '#ff9800'; // Оранжевый во время поиска
            btn.style.pointerEvents = 'none';
            var svg = btn.querySelector('svg');
            if (svg) {
                svg.style.transition = 'transform 1s ease-in-out';
                svg.style.transform = 'rotate(405deg)'; 
            }
        }
        
        navigator.geolocation.getCurrentPosition(
            function(position) {
                var lat = position.coords.latitude.toFixed(6);
                var lon = position.coords.longitude.toFixed(6);
                
                document.getElementById('f_staff_lat').value = lat;
                document.getElementById('f_staff_lon').value = lon;
                
                if (btn) {
                    btn.style.color = '#2e7d32'; // Зелёный при успехе
                    var svg = btn.querySelector('svg');
                    if (svg) {
                        svg.style.transition = 'none';
                        svg.style.transform = 'rotate(45deg)';
                    }
                    btn.style.pointerEvents = 'auto';
                    btn.title = 'Определить мои координаты';
                }
                
                syncEverything();
            },
            function(error) {
                console.error('Ошибка геолокации:', error);
                var errorMsg = 'Не удалось получить координаты';
                if (error.code === error.PERMISSION_DENIED) {
                    errorMsg = 'Доступ к геопозиции отклонен';
                } else if (error.code === error.POSITION_UNAVAILABLE) {
                    errorMsg = 'Координаты недоступны';
                } else if (error.code === error.TIMEOUT) {
                    errorMsg = 'Превышено время ожидания';
                }
                
                alert(errorMsg);
                
                if (btn) {
                    btn.style.color = '#f44336'; // Красный при ошибке
                    var svg = btn.querySelector('svg');
                    if (svg) {
                        svg.style.transition = 'none';
                        svg.style.transform = 'rotate(45deg)';
                    }
                    btn.style.pointerEvents = 'auto';
                    btn.title = 'Ошибка: ' + errorMsg;
                }
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    function onInforgChange() {
        var select = document.getElementById('inforg-select');
        var infoDiv = document.getElementById('inforg-info');
        var nameSpan = document.getElementById('inforg-name');
        var phoneA = document.getElementById('inforg-phone');
        var vkA = document.getElementById('inforg-vk');
        
        if (!select) return;
        var val = select.value;
        if (!val) {
            if (infoDiv) infoDiv.style.display = 'none';
        } else {
            var data = INFORG_DATA[val];
            if (data) {
                if (nameSpan) nameSpan.textContent = data.name;
                if (phoneA) {
                    phoneA.textContent = data.phone;
                    phoneA.href = 'tel:' + data.phone;
                }
                if (vkA) vkA.href = data.vk;
                if (infoDiv) infoDiv.style.display = 'inline-flex';
            } else {
                if (infoDiv) infoDiv.style.display = 'none';
            }
        }
        select.blur();
        syncEverything();
        sendHeight();
    }

    // IndexedDB - открытие
    function openDB() {
        return new Promise(function(resolve, reject) {
            var request = indexedDB.open("NPCR_Images", 1);
            
            request.onerror = function() {
                console.error("IndexedDB error");
                reject(request.error);
            };
            
            request.onsuccess = function() {
                db = request.result;
                resolve(db);
            };
            
            request.onupgradeneeded = function(event) {
                var database = event.target.result;
                if (!database.objectStoreNames.contains("images")) {
                    database.createObjectStore("images", { keyPath: "id" });
                }
            };
        });
    }

    // IndexedDB - сохранение картинки
    function saveImageToDB(id, file) {
        return new Promise(function(resolve, reject) {
            if (!db) {
                openDB().then(function() {
                    saveImageToDB(id, file).then(resolve).catch(reject);
                });
                return;
            }
            
            var reader = new FileReader();
            reader.onload = function(e) {
                var transaction = db.transaction(["images"], "readwrite");
                var store = transaction.objectStore("images");
                var request = store.put({ id: id, data: e.target.result, name: file.name });
                request.onsuccess = function() { resolve(id); };
                request.onerror = function() { reject(request.error); };
            };
            reader.onerror = function() { reject(reader.error); };
            reader.readAsDataURL(file);
        });
    }

    // IndexedDB - получение картинки
    function getImageFromDB(id) {
        return new Promise(function(resolve, reject) {
            if (!db) {
                openDB().then(function() {
                    getImageFromDB(id).then(resolve).catch(reject);
                });
                return;
            }
            
            var transaction = db.transaction(["images"], "readonly");
            var store = transaction.objectStore("images");
            var request = store.get(id);
            request.onsuccess = function() { resolve(request.result ? request.result.data : null); };
            request.onerror = function() { reject(request.error); };
        });
    }

    // IndexedDB - удаление картинки
    function deleteImageFromDB(id) {
        return new Promise(function(resolve, reject) {
            if (!db) {
                resolve();
                return;
            }
            
            var transaction = db.transaction(["images"], "readwrite");
            var store = transaction.objectStore("images");
            var request = store.delete(id);
            request.onsuccess = function() { resolve(); };
            request.onerror = function() { reject(request.error); };
        });
    }

    // Отобразить картинки
    function renderOrientImages() {
        var container = document.getElementById('orient-images');
        container.innerHTML = '';
        
        if (orientImages.length === 0) return;
        
        orientImages.forEach(function(id) {
            getImageFromDB(id).then(function(dataUrl) {
                if (!dataUrl) return;
                
                var div = document.createElement('div');
                div.style.position = 'relative';
                div.style.marginBottom = '10px';
                div.style.overflow = 'hidden';
                
                var img = document.createElement('img');
                img.src = dataUrl;
                img.style.width = '100%';
                img.style.borderRadius = '6px';
                img.style.border = '1px solid #ccc';
                img.style.touchAction = 'none';
                
                var removeBtn = document.createElement('span');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '×';
                removeBtn.style.position = 'absolute';
                removeBtn.style.top = '5px';
                removeBtn.style.right = '5px';
                removeBtn.style.background = 'rgba(255,255,255,0.9)';
                removeBtn.style.borderRadius = '50%';
                removeBtn.style.width = '24px';
                removeBtn.style.height = '24px';
                removeBtn.style.display = 'flex';
                removeBtn.style.alignItems = 'center';
                removeBtn.style.justifyContent = 'center';
                removeBtn.onclick = function() { removeOrientImage(id); };
                
                div.appendChild(img);
                div.appendChild(removeBtn);
                container.appendChild(div);
                
                // Свой зум и пан двумя пальцами
                var initialDistance = 0;
                var initialScale = 1;
                var currentScale = 1;
                var currentPan = { x: 0, y: 0 };
                var lastTouchX = 0, lastTouchY = 0;
                var panStart = { x: 0, y: 0 };
                var imgRect = null;
                
                // Вычисляем границы пана
                function getPanLimits() {
                    if (!imgRect) imgRect = img.getBoundingClientRect();
                    var w = imgRect.width * currentScale - imgRect.width;
                    var h = imgRect.height * currentScale - imgRect.height;
                    return {
                        maxX: w / 2,
                        maxY: h / 2
                    };
                }
                
                img.addEventListener('touchstart', function(e) {
                    if (e.touches.length === 2) {
                        imgRect = img.getBoundingClientRect(); // обновляем при начале
                        
                        // Зум
                        var dx = e.touches[0].clientX - e.touches[1].clientX;
                        var dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialDistance = Math.sqrt(dx*dx + dy*dy);
                        initialScale = currentScale;
                        
                        // Пан
                        lastTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        lastTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        panStart.x = currentPan.x;
                        panStart.y = currentPan.y;
                        
                        e.preventDefault();
                    }
                }, { passive: false });
                
                img.addEventListener('touchmove', function(e) {
                    if (e.touches.length === 2) {
                        // Зум
                        var dx = e.touches[0].clientX - e.touches[1].clientX;
                        var dy = e.touches[0].clientY - e.touches[1].clientY;
                        var distance = Math.sqrt(dx*dx + dy*dy);
                        
                        if (initialDistance > 0) {
                            var newScale = (distance / initialDistance) * initialScale;
                            if (newScale < 1) newScale = 1;
                            if (newScale > 3) newScale = 3;
                            currentScale = newScale;
                        }
                        
                        // Пан
                        var touchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        var touchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        var panDx = touchX - lastTouchX;
                        var panDy = touchY - lastTouchY;
                        
                        if (currentScale > 1) {
                            currentPan.x = panStart.x + panDx;
                            currentPan.y = panStart.y + panDy;
                            
                            // Ограничиваем границами
                            var limits = getPanLimits();
                            if (currentPan.x > limits.maxX) currentPan.x = limits.maxX;
                            if (currentPan.x < -limits.maxX) currentPan.x = -limits.maxX;
                            if (currentPan.y > limits.maxY) currentPan.y = limits.maxY;
                            if (currentPan.y < -limits.maxY) currentPan.y = -limits.maxY;
                        }
                        
                        img.style.transform = 'translate(' + currentPan.x + 'px, ' + currentPan.y + 'px) scale(' + currentScale + ')';
                        img.style.transformOrigin = 'center center';
                        
                        e.preventDefault();
                    }
                }, { passive: false });
                
                img.addEventListener('touchend', function(e) {
                    if (e.touches.length < 2) {
                        initialDistance = 0;
                        if (currentScale === 1) {
                            currentPan = { x: 0, y: 0 };
                        }
                    }
                });
                
                // Один палец - скролл страницы (не блокируем)
                img.style.touchAction = 'pan-y';
            });
        });
    }

    // Добавить контакт из строки участника
    function addContactFromRow(btn) {
        var row = btn.closest('.member-row');
        var name = row.querySelector('.member-name').value.trim();
        var phone = row.querySelector('.member-phone').value.trim();
        
        if (!name && !phone) {

        addToContacts(name, phone);

    // Добавить в контакты (vCard)
    function addToContacts(name, phone) {
        if (!name && !phone) {
            alert('Введите имя или номер телефона');
            return;
        }
        
        var vcard = 'BEGIN:VCARD\nVERSION:3.0\n';
        if (name) vcard += 'FN:' + name + '\n';
        if (phone) vcard += 'TEL:' + phone + '\n';
        vcard += 'END:VCARD';
        
        var blob = new Blob([vcard], { type: 'text/vcard' });
        var url = URL.createObjectURL(blob);
        
        var a = document.createElement('a');
        a.href = url;
        a.download = (name || 'contact') + '.vcf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Загрузка картинок из IndexedDB
    // Только синхронизирует массив ключей с IDB, не вызывает повторный рендер
    // если orientImages уже заполнен из loadLocal()
    function loadOrientImages() {
        return new Promise(function(resolve) {
            if (!db) {
                openDB().then(function() {
                    loadOrientImages().then(resolve);
                });
                return;
            }
            
            var transaction = db.transaction(["images"], "readonly");
            var store = transaction.objectStore("images");
            var request = store.getAllKeys();
            
            request.onsuccess = function() {
                var keysFromDB = request.result || [];
                // Если orientImages уже заполнен из localStorage — не перезаписываем и не рендерим повторно
                if (orientImages.length === 0) {
                    orientImages = keysFromDB;
                    renderOrientImages();
                }
                resolve();
            };
            
            request.onerror = function() {
                if (orientImages.length === 0) orientImages = [];
                resolve();
            };
        });
    }

    // Добавить участника в задачу
    function addMemberToTask(taskId, name, phone, isSenior) {
        var container = document.getElementById('members-' + taskId);
        if (!container) return;
        
        var count = container.querySelectorAll('.member-row:not(.senior)').length;
        var isFirstSenior = !container.querySelector('.senior');
        
        var div;
        
        if (isSenior && isFirstSenior) {
            // Старший группы — без крестика
            div = document.createElement('div');
            div.className = 'member-row senior';
            div.innerHTML = 
                '<div class="member-fields senior-fields">' +
                    '<span class="member-number">1.</span>' +
                    '<input type="text" id="z_call_name" class="q-field member-senior" placeholder="Старший группы" value="' + (name || '') + '">' +
                '</div>';
        } else {
            // Остальные участники — крестик только для №3 и выше
            var canRemove = count > 0; // count = 0 это участник №2, count > 0 это №3 и далее
            div = document.createElement('div');
            div.className = 'member-row';
            div.innerHTML = 
                '<div class="member-fields">' +
                    '<span class="member-number">' + (count + 2) + '.</span>' +
                    '<input type="text" class="q-field member-name" placeholder="ФИО" value="' + (name || '') + '">' +
                    '<span class="add-contact-btn" onclick="addContactFromRow(this)" title="Добавить в контакты">+</span>' +
                    '<input type="text" class="q-field member-phone" placeholder="88009000000" value="' + (phone || '') + '">' +
                    (canRemove ? '<span class="remove-btn" onclick="removeMember(this)">×</span>' : '<span class="spacer-20"></span>') +
                '</div>';
        }
        
        container.appendChild(div);
        
        // События
        div.querySelectorAll('input').forEach(function(input) {
            input.addEventListener('input', function() {
                // Если это старший первой задачи - синхронизируем
                if (isSenior && isFirstSenior) {
                    var val = this.value.trim();
                    localStorage.setItem('pso_senior_callsign', val);
                    window.parent.postMessage({ type: 'sync_field', fieldId: 'z_call_name', value: val }, '*');
                }
                syncEverything();
            });
        });
        
        // Перенумеровать
        renumberMembers(container);
        
        // Сразу сохранить
        saveLocal();
        sendHeight();
    }

                if (membersContainer) {
                    membersContainer.querySelectorAll('.member-row:not(.senior)').forEach(function(row) {
                        var nameEl = row.querySelector('.member-name');
                        var name = nameEl ? nameEl.value.trim() : '';
                        var phoneEl = row.querySelector('.member-phone');
                        var phone = phoneEl ? phoneEl.value.trim() : '';
                        if (name || phone) {
                            members.push({ name: name, phone: phone, nameEl: nameEl, phoneEl: phoneEl });
                        }
                    });
                }
                
                if (callsign || desc || seniorVal || members.length > 0) {
                    payload.push({ label: 'ЗАДАЧА ' + taskNum, value: '', isHeader: true });
                    if (callsign) {
                        payload.push({ label: 'Позывной', value: callsign });
                        if (callsignEl) callsignEl.setAttribute('data-index', payload.length - 1);
                    }
                    if (desc) {
                        payload.push({ label: 'Задача', value: desc });
                        if (descEl) descEl.setAttribute('data-index', payload.length - 1);
                    }
                    if (seniorVal || members.length > 0) {
                        if (seniorVal) {
                            payload.push({ label: '', value: '1. ' + seniorVal });
                            if (seniorEl) seniorEl.setAttribute('data-index', payload.length - 1);
                        }
                        members.forEach(function(m, i) {
                            var line = (i + 2) + '. ' + m.name;
                            if (m.phone) line += ' ' + m.phone;
                            payload.push({ label: '', value: line });
                            var currentIdx = payload.length - 1;
                            if (m.nameEl) m.nameEl.setAttribute('data-index', currentIdx);
                            if (m.phoneEl) m.phoneEl.setAttribute('data-index', currentIdx);
                        });
                    }
                }
            });
            
            window.parent.postMessage({ 
                type: 'survey_update', 
                source: SOURCE_ID, 
                payload: payload 
            }, '*');

            // Сохраняем старшего из задачи 1 для синхронизации
            var firstTaskSenior = '';
            var firstTaskContainer = document.querySelector('#tasks-container .section-block');
            if (firstTaskContainer) {
                var seniorEl = firstTaskContainer.querySelector('.member-row.senior .member-senior');
                if (seniorEl) firstTaskSenior = seniorEl.value.trim();
            }
            if (firstTaskSenior) {
                localStorage.setItem('pso_senior_callsign', firstTaskSenior);
            }

            saveLocal();
            sendHeight();
        }, 150);
    }



    // Сохранение в localStorage
    function saveLocal() {
        var tasks = [];
        
        document.querySelectorAll('#tasks-container .section-block').forEach(function(taskBlock) {
            var taskId = taskBlock.getAttribute('data-task-id');
            var membersContainer = taskBlock.querySelector('.members-container');
            
            var seniorEl = membersContainer.querySelector('.member-row.senior .member-senior');
            
            var members = [];
            membersContainer.querySelectorAll('.member-row:not(.senior)').forEach(function(row) {
                members.push({
                    name: row.querySelector('.member-name').value,
                    phone: row.querySelector('.member-phone').value
                });
            });
            
            tasks.push({
                callsign: taskBlock.querySelector('.task-callsign').value,
                desc: taskBlock.querySelector('.task-desc').value,
                senior: seniorEl ? seniorEl.value : '',
                members: members,
                open: taskBlock.classList.contains('open')
            });
        });
        
        var sections = {};
        document.querySelectorAll('.section-block').forEach(function(block) {
            var name = block.id.replace('section-', '');
            sections[name] = block.classList.contains('open');
        });
        
        var data = {
            staff: {
                lat: document.getElementById('f_staff_lat').value,
                lon: document.getElementById('f_staff_lon').value,
                num: document.getElementById('f_staff_num').value,
                freq: document.getElementById('f_staff_freq').value,
                azimuth: document.getElementById('f_staff_azimuth').value,
                orient: document.getElementById('f_staff_orient').value
            },
            info: {
                fio: document.getElementById('f_info_fio').value,
                home_name: document.getElementById('f_info_home_name').value,
                appearance: document.getElementById('f_info_appearance').value
            },
            tasks: tasks,
            sections: sections,
            orientImages: orientImages,
            selectedInforg: document.getElementById('inforg-select') ? document.getElementById('inforg-select').value : ''
        };
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // Загрузка из localStorage
    function loadLocal() {
        return new Promise(function(resolve) {
            // Пробуем новую версию, потом старую
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                raw = localStorage.getItem('survey_cache_npcr_v1');
            }
            
            if (!raw) {
                // По умолчанию 1 задача
                addTask(null);
                resolve();
                return;
            }
            
        try {
            var data = JSON.parse(raw);
            
            // ШТАБ
            if (data.staff) {
                document.getElementById('f_staff_lat').value = data.staff.lat || '';
                document.getElementById('f_staff_lon').value = data.staff.lon || '';
                document.getElementById('f_staff_num').value = data.staff.num || '';
                document.getElementById('f_staff_freq').value = data.staff.freq || '';
                document.getElementById('f_staff_orient').value = data.staff.orient || '';
                document.getElementById('f_staff_azimuth').value = data.staff.azimuth || '';
            }
            
            // ВВОДНЫЕ ПО ПОИСКУ
            if (data.info) {
                document.getElementById('f_info_fio').value = data.info.fio || '';
                document.getElementById('f_info_home_name').value = data.info.home_name || '';
                document.getElementById('f_info_appearance').value = data.info.appearance || '';
            }
            
            // Штаб - состояние
            var staffBlock = document.getElementById('section-staff');
            if (data.sections && data.sections.staff === false) {
                staffBlock.classList.remove('open');
            }
            
            // Вводные - состояние
            var infoBlock = document.getElementById('section-info');
            if (data.sections && data.sections.info === false) {
                infoBlock.classList.remove('open');
            }
            
            // Ориентировка - состояние
            var orientBlock = document.getElementById('section-orient');
            if (data.sections && data.sections.orient === false) {
                orientBlock.classList.remove('open');
            }
            
            // ИНФОРГ
            if (data.selectedInforg) {
                var selectEl = document.getElementById('inforg-select');
                if (selectEl) {
                    selectEl.value = data.selectedInforg;
                    onInforgChange();
                }
            }
            
            // ОРИЕНТИРОВКА
            if (data.orientImages && Array.isArray(data.orientImages)) {
                orientImages = data.orientImages;
                renderOrientImages();
            }
            
            // ЗАДАЧИ
            if (data.tasks && data.tasks.length > 0) {
                data.tasks.forEach(function(t) {
                    addTask(t);
                });
                
                // Восстановить состояние задач после добавления
                if (data.sections) {
                    data.tasks.forEach(function(t, idx) {
                        var taskBlock = document.querySelector('#tasks-container .section-block:nth-child(' + (idx + 1) + ')');
                        if (taskBlock && t.open === false) {
                            taskBlock.classList.remove('open');
                        }
                    });
                }
            } else {
                addTask(null);
            }
            
        } catch(e) {
            console.error('Ошибка загрузки:', e);
            addTask(null);
        }
        
        resolve();
        });
    }

    // Отправка высоты
    function sendHeight() {
        var height = document.documentElement.offsetHeight || document.body.scrollHeight;
        window.parent.postMessage({ type: 'set_height', height: height }, '*');
    }

    // Auto-grow для textarea
    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    // Инициализация
    window.onload = function() {
        openDB().then(function() {
            loadLocal().then(function() {
                // loadOrientImages вызывается после loadLocal, но не перерисовывает если уже есть данные
                loadOrientImages().then(function() {
                    autoGrow(document.getElementById('f_info_appearance'));
                    syncEverything();
                    sendHeight();
                });
            });
        });
    };
</script>
